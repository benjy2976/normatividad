apiVersion: apps/v1
kind: Deployment
metadata:
  name: normatividad-frontend
  namespace: ocr-service
  labels:
    app.kubernetes.io/name: normatividad-frontend
    app.kubernetes.io/part-of: normatividad-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: normatividad-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: normatividad-frontend
        app.kubernetes.io/part-of: normatividad-services
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: frontend
          image: ryuk89/normatividad-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: normatividad-frontend-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

