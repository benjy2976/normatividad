apiVersion: apps/v1
kind: Deployment
metadata:
  name: normatividad-backend
  namespace: ocr-service
  labels:
    app.kubernetes.io/name: normatividad-backend
    app.kubernetes.io/part-of: normatividad-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: normatividad-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: normatividad-backend
        app.kubernetes.io/part-of: normatividad-services
    spec:
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        fsGroup: 33
      containers:
        - name: backend
          image: ryuk89/normatividad-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: normatividad-backend-config
            - secretRef:
                name: normatividad-backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: ocr-shared-cache
              mountPath: /mnt/ocr-cache
              readOnly: true
            - name: regulations-storage
              mountPath: /mnt/regulations
              readOnly: true
            - name: tmp-views
              mountPath: /tmp/laravel
            - name: storage-framework
              mountPath: /app/storage/framework
          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: ocr-shared-cache
          persistentVolumeClaim:
            claimName: ocr-shared-cache
        - name: regulations-storage
          persistentVolumeClaim:
            claimName: normatividad-regulations-pvc
        - name: tmp-views
          emptyDir: {}
        - name: storage-framework
          emptyDir: {}
