map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # El prefijo público /resources no forma parte de las rutas internas
    # de Laravel. /resources/v1/... se entrega al backend como /v1/...
    location = /resources {
        return 308 /resources/;
    }

    location /resources/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reservado para una futura respuesta X-Accel-Redirect de la API.
    # Al ser internal, estas rutas nunca son accesibles directamente.
    location ^~ /_media/regulations/ {
        internal;
        alias /mnt/regulations/;
    }

    location ^~ /_media/ocr-cache/ {
        internal;
        alias /mnt/ocr-cache/;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
